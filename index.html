   <!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A futuristic, responsive Tic-Tac-Toe web application featuring an unbeatable Minimax AI, synthesized sound effects, customizable difficulties, and stunning neon aesthetics. Built with vanilla HTML, CSS, and JavaScript.">
  <title>Neon Tic-Tac-Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <div class="app-container">
    <header class="app-header">
      <h1 class="logo-title">NEON<span class="neon-text-alt">XO</span></h1>
      <div class="header-controls">
        <button id="btn-sound-toggle" class="header-btn" title="Toggle Sound" aria-label="Toggle Sound">
          <svg class="icon" viewBox="0 0 24 24" width="24" height="24">
            <path id="sound-icon-path" fill="currentColor" d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.85 14,18.71V20.77C18.01,19.86 21,16.28 21,12C21,7.72 18.01,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16C15.5,15.29 16.5,13.77 16.5,12M3,9V15H7L12,20V4L7,9H3Z" />
          </svg>
        </button>
        <button id="btn-theme-toggle" class="header-btn" title="Toggle Theme" aria-label="Toggle Theme">
          <svg class="icon" viewBox="0 0 24 24" width="24" height="24">
            <path id="theme-icon-path" fill="currentColor" d="M12,18C11.11,18 10.26,17.8 9.5,17.45C11.56,16.5 13,14.42 13,12C13,9.58 11.56,7.5 9.5,6.55C10.26,6.2 11.11,6 12,6A6,6 0 0,1 18,12A6,6 0 0,1 12,18M20,8.69V4H15.31L12,0.69L8.69,4H4V8.69L0.69,12L4,15.31V20H8.69L12,23.31L15.31,20H20V15.31L23.31,12L20,8.69Z" />
          </svg>
        </button>
      </div>
    </header>

    <main class="game-area">
      <!-- Configuration Panel -->
      <section class="config-panel glass-card">
        <div class="control-group">
          <label for="mode-select">Game Mode</label>
          <div class="custom-select-wrapper">
            <select id="mode-select">
              <option value="pvc">Player vs AI</option>
              <option value="pvp">Player vs Player</option>
            </select>
          </div>
        </div>

        <div id="difficulty-group" class="control-group">
          <label for="difficulty-select">AI Difficulty</label>
          <div class="custom-select-wrapper">
            <select id="difficulty-select">
              <option value="easy">Easy (Random)</option>
              <option value="medium">Medium (Smart)</option>
              <option value="hard" selected>Hard (Unbeatable)</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Scoreboard -->
      <section class="scoreboard">
        <div class="score-card x-score glass-card" id="score-card-x">
          <span class="score-label">Player X</span>
          <span class="score-val" id="score-x">0</span>
        </div>
        <div class="score-card draws-score glass-card">
          <span class="score-label">Draws</span>
          <span class="score-val" id="score-draws">0</span>
        </div>
        <div class="score-card o-score glass-card" id="score-card-o">
          <span class="score-label" id="label-o">AI (O)</span>
          <span class="score-val" id="score-o">0</span>
        </div>
      </section>

      <!-- Game Status Indicator -->
      <div id="game-status" class="status-indicator">Your Turn (X)</div>

      <!-- Game Board Grid -->
      <section class="board-wrapper">
        <div class="board" id="game-board">
          <button class="cell" data-index="0" aria-label="Cell 1"></button>
          <button class="cell" data-index="1" aria-label="Cell 2"></button>
          <button class="cell" data-index="2" aria-label="Cell 3"></button>
          <button class="cell" data-index="3" aria-label="Cell 4"></button>
          <button class="cell" data-index="4" aria-label="Cell 5"></button>
          <button class="cell" data-index="5" aria-label="Cell 6"></button>
          <button class="cell" data-index="6" aria-label="Cell 7"></button>
          <button class="cell" data-index="7" aria-label="Cell 8"></button>
          <button class="cell" data-index="8" aria-label="Cell 9"></button>
        </div>
      </section>

      <!-- Control Buttons -->
      <section class="action-buttons">
        <button id="btn-undo" class="action-btn secondary-btn" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M12.5 8c-2.65 0-5.05 1-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/>
          </svg>
          Undo
        </button>
        <button id="btn-restart" class="action-btn primary-btn">
          <svg class="btn-icon" viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
          Restart Match
        </button>
        <button id="btn-reset-score" class="action-btn danger-btn">
          <svg class="btn-icon" viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M19 4H15.5L14.5 3H9.5L8.5 4H5V6H19M6 19A2 2 0 0,0 8 21H16A2 2 0 0,0 8 21H16A2 2 0 0,0 18 19V7H6V19Z"/>
          </svg>
          Reset Scores
        </button>
      </section>
    </main>

    <footer class="app-footer">
      <p>Created with <span class="heart">&hearts;</span> by Antigravity</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
